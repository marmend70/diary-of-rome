<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diary of Rome for Curious Travelers</title>
<meta name="description" content="Stories from the Instagram posts of Diary of Rome for Curious Travelers: tap a photo to read the article.">
<style>
  :root { --bg:#faf7f2; --text:#2b2118; --muted:#7a6a58; --accent:#8c3b1f; --tile:#e9e2d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16120e; --text:#f1ebe2; --muted:#b3a593; --accent:#e0915f; --tile:#2a231c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 Georgia, "Times New Roman", serif; }
  header { max-width:720px; margin:0 auto; padding:32px 16px 20px; text-align:center; }
  h1 { font-size:26px; line-height:1.2; margin:0 0 8px; }
  header p { margin:0 0 18px; color:var(--muted); font-style:italic; }
  .blog { display:inline-block; padding:10px 22px; border-radius:999px; background:var(--accent);
          color:#fff; text-decoration:none; font-family:-apple-system, "Segoe UI", sans-serif; font-size:15px; }
  main { max-width:720px; margin:0 auto; padding:0 16px 40px;
         display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  @media (max-width:480px) { main { grid-template-columns:repeat(2, 1fr); } }
  main a { display:block; background:var(--tile); aspect-ratio:4/5; overflow:hidden; border-radius:4px; }
  main img { width:100%; height:100%; object-fit:cover; display:block; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0; }
</style></head>
<body>
<header>
  <h1>Diary of Rome for Curious Travelers</h1>
  <p>Tap a photo to read the story behind the post.</p>
  <a class="blog" href="https://visitrome.substack.com">Read the blog</a>
</header>
<main>
<a href="https://visitrome.substack.com/p/a-roman-detour-santalfonso-and-the"><img src="covers/a-roman-detour-santalfonso-and-the.jpg" alt="A Roman Detour: Sant’Alfonso and the Beauty of an Unexpected Discovery" loading="lazy"></a>
</main>
</body></html>
